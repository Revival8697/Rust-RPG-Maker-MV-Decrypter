[package]
name = "rpgmv-decrypter"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
description = "High-performance, idiomatic Rust port of RPG Maker MV/MZ Decrypter with parallel processing and memory safety"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sp1cyf0x/Rust-RPG-Maker-MV-Decrypter"
keywords = ["rpg-maker", "rpgmv", "rpgmz", "decrypter", "game-assets"]
categories = ["command-line-utilities", "multimedia"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "rpgmv-decrypter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"], optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
hex = "0.4"
tempfile = "3"

[dev-dependencies]

